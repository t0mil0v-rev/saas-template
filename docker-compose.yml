#  Production stack.  Запуск:  docker compose up -d --build
#
#  Принципы:
#    * наружу торчит ТОЛЬКО caddy (80/443). Postgres и Redis портов не публикуют.
#    * сервисы лишены лишних capabilities, root FS доступна только для чтения.
#    * миграции - отдельный one-shot сервис, api стартует только после его успеха.
#    * логи ротируются драйвером docker, диск не забьётся.

x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  read_only: true
  restart: unless-stopped
  logging: *logging

networks:
  # Внутренняя сеть без выхода наружу: БД, кэш и API изолированы.
  backend:
    driver: bridge
    internal: true
  # Сеть с выходом в интернет нужна Caddy, API и почтовому worker.
  edge:
    driver: bridge

volumes:
  pg_data:
  redis_data:
  caddy_data:
  caddy_config:
  web_dist:

services:
  # PostgreSQL
  postgres:
    image: postgres:16-alpine@sha256:44c4ee9810eff91f7eab4d822642e01115b1a9eccce4bcbdde7604752d68eac6
    <<: *hardening
    cap_add:
      - CHOWN
      - DAC_READ_SEARCH
      - FOWNER
      - SETGID
      - SETUID
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-saas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-saas}
      # scram-sha-256 вместо md5
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
      PGDATA: /var/lib/postgresql/data/pgdata
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=768MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - wal_compression=on
      - -c
      - log_min_duration_statement=1000
      - -c
      - log_connections=on
      - -c
      - log_disconnections=on
      - -c
      - password_encryption=scram-sha-256
    volumes:
      - pg_data:/var/lib/postgresql/data
    tmpfs:
      - /tmp:size=128m,mode=1777
      - /run/postgresql:size=16m
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-saas} -d ${POSTGRES_DB:-saas} -h 127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1g
          pids: 256

  # Redis - rate limit / кэш. Приложение переживает его падение (fallback в память).
  redis:
    image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    <<: *hardening
    user: "999:999"
    read_only: true
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ""
    volumes:
      - redis_data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    deploy:
      resources:
        limits:
          memory: 320m
          pids: 256

  # Миграции + первичный bootstrap. One-shot: отработал и вышел с кодом 0.
  migrate:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    image: saas-api:latest
    env_file: [.env]
    environment:
      POSTGRES_HOST: postgres
      REDIS_URL: ""
    command: ["python", "-m", "app.cli", "init"]
    read_only: true
    tmpfs:
      - /tmp:size=32m
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    logging: *logging
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    deploy:
      resources:
        limits:
          pids: 64

  # API
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    image: saas-api:latest
    <<: *hardening
    env_file: [.env]
    environment:
      POSTGRES_HOST: postgres
    read_only: true
    tmpfs:
      - /tmp:size=64m
    networks:
      - backend
      - edge          # нужен только для исходящего SMTP; входящий доступ даёт caddy
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-m", "app.cli", "healthcheck"]
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 20s
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 1g
          pids: 256

  # Почтовая очередь. Письмо сначала коммитится вместе с бизнес-операцией,
  # затем этот процесс доставляет его с retry и lease после падения worker.
  mail-worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    image: saas-api:latest
    <<: *hardening
    env_file: [.env]
    environment:
      POSTGRES_HOST: postgres
    command: ["python", "-m", "app.cli", "mail-worker"]
    read_only: true
    tmpfs:
      - /tmp:size=32m
    networks:
      - backend
      - edge
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 20s
    deploy:
      resources:
        limits:
          memory: 256m
          pids: 256

  # Сборка фронтенда: выкладывает статику в volume и завершается.
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        VITE_PUBLIC_URL: ${PUBLIC_URL}
        VITE_APP_NAME: ${APP_NAME}
    image: saas-web:latest
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    volumes:
      - web_dist:/out
    command: ["/bin/sh", "-c", "rm -rf /out/* && cp -a /dist/. /out/ && echo 'web assets published'"]
    logging: *logging
    restart: "no"
    deploy:
      resources:
        limits:
          pids: 64

  # Caddy - единственная точка входа. TLS-режим выбирается переменной TLS_MODE.
  caddy:
    image: caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    <<: *hardening
    command: ["caddy", "run", "--config", "/etc/caddy/${TLS_MODE:-acme}.Caddyfile", "--adapter", "caddyfile"]
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is required}
      ACME_EMAIL: ${ACME_EMAIL:-}
      ACME_CA: ${ACME_CA:-}
      PUBLIC_URL: ${PUBLIC_URL}
    ports:
      - "${PROXY_HTTP_PORT:-80}:80"
      - "${PROXY_HTTPS_PORT:-443}:443"
      - "${PROXY_HTTPS_PORT:-443}:443/udp"   # HTTP/3
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_add:
      - NET_BIND_SERVICE
    volumes:
      - ./deploy/caddy:/etc/caddy:ro
      - ./deploy/certs:/etc/caddy/certs:ro
      - web_dist:/srv/www:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - backend
      - edge
    depends_on:
      web:
        condition: service_completed_successfully
      api:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2019/config/", "--timeout=3"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 256m
          pids: 256
