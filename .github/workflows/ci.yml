name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine@sha256:44c4ee9810eff91f7eab4d822642e01115b1a9eccce4bcbdde7604752d68eac6
        env:
          POSTGRES_USER: saas
          POSTGRES_PASSWORD: integration-password
          POSTGRES_DB: saas_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U saas -d saas_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: apps/api
    env:
      APP_ENV: development
      SECRET_KEY: integration-secret-key-with-at-least-32-characters
      POSTGRES_USER: saas
      POSTGRES_PASSWORD: integration-password
      POSTGRES_DB: saas_test
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://127.0.0.1:6379/0
      TEST_REDIS_URL: redis://127.0.0.1:6379/1
      RUN_INTEGRATION: "1"
      REQUIRE_EMAIL_VERIFICATION: "false"
      MAIL_TRANSPORT: console
      API_WORKERS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.lock
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: python -m alembic upgrade head
      - run: ruff check app tests migrations
      - run: ruff format --check app tests migrations
      - run: mypy app
      - run: pytest -q --cov=app --cov-branch --cov-report=xml --cov-fail-under=50
      - run: pip-audit -r requirements.lock
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: api-coverage
          path: apps/api/coverage.xml
          if-no-files-found: error

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:coverage
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          if-no-files-found: ignore

  infrastructure:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate shell scripts
        run: shellcheck deploy/scripts/*.sh deploy/systemd/install.sh
      - name: Validate Compose model
        run: |
          cp .env.example .env
          sed -i 's/CHANGE_ME/test-secret-long-enough-for-compose/g' .env
          docker compose config --quiet
      - name: Build production images
        run: |
          docker build --target production -t saas-api:test apps/api
          docker build -t saas-web:test apps/web
