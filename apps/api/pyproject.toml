[project]
name = "saas-api"
version = "1.0.0"
description = "Защищённое ядро SaaS: аутентификация, мультитенантность, модерация отзывов"
# Строго 3.11 - версия зафиксирована по требованию эксплуатации.
requires-python = "==3.11.*"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "S",        # bandit - правила безопасности
    "UP",       # pyupgrade
    "ASYNC",    # ловушки asyncio
    "T20",      # никаких print() в проде
    "RUF",
]
ignore = [
    "S101",  # assert разрешён в тестах
    "B008",  # Depends(...) в аргументах по умолчанию - идиома FastAPI
    # Исходники и документация на русском: это не маскировка символов, а
    # штатная кириллица, поэтому ambiguous-Unicode проверки здесь шумят.
    "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S311"]
"app/cli.py" = ["T20"]  # CLI пишет в stdout осознанно

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["pyotp.*", "argon2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning"]
markers = [
    "integration: requires live PostgreSQL or Redis",
]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
