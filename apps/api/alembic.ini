[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
# The URL comes from app.core.config; do not store database passwords here.
sqlalchemy.url =

# Revision names such as 0001_initial_schema.py sort as a chronological history.
file_template = %%(rev)s_%%(slug)s

[post_write_hooks]
hooks = ruff
ruff.type = console_scripts
ruff.entrypoint = ruff
ruff.options = format REVISION_SCRIPT_FILENAME

# Application logging is configured in app.core.logging; Alembic still needs this section.
[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
